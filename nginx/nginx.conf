proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=s3_cdn_cache:50m max_size=5g inactive=24h use_temp_path=off;

server {
    listen 8082;
    server_name localhost;

    # Gzip compression for JSON reports
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1000;

    location / {
        # Access only via a short-lived signed link issued by reports-api after the JWT check:
        #   ?md5=<base64url(md5("<expires><uri> <secret>"))>&expires=<unix_ts>
        # The signature covers the object path (which contains the username),
        # so knowing another user's path without a valid signature gives 403.
        # ${CDN_SECURE_LINK_SECRET} is substituted by the nginx image entrypoint (envsubst templates).
        secure_link $arg_md5,$arg_expires;
        secure_link_md5 "$secure_link_expires$uri ${CDN_SECURE_LINK_SECRET}";

        if ($secure_link = "") {
            return 403;
        }
        if ($secure_link = "0") {
            return 410;
        }

        # Read-only access through the CDN
        limit_except GET HEAD {
            deny all;
        }

        # Proxy to MinIO S3 storage
        proxy_pass http://minio:9000;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # CDN Caching Configuration
        # Cache key excludes the signature query args, so all valid links to one object share an entry.
        # The signature is checked above on every request, before the cache is consulted.
        proxy_cache s3_cdn_cache;
        proxy_cache_key "$scheme$request_method$host$uri";
        proxy_cache_valid 200 206 1h;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;

        # Add CDN cache status header to inspect HIT / MISS / EXPIRED / STALE
        add_header X-Cache-Status $upstream_cache_status always;
        # Personal data: must not be stored by browsers or intermediate shared caches
        add_header Cache-Control "private, no-store" always;

        # Bypass cache on client request if Cache-Control: no-cache header is provided
        proxy_cache_bypass $http_cache_control;
    }
}
