proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=s3_cdn_cache:50m max_size=5g inactive=24h use_temp_path=off;

server {
    listen 8082;
    server_name localhost;

    # Gzip compression for JSON reports
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1000;

    location / {
        # Proxy to MinIO S3 storage
        proxy_pass http://minio:9000;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # CDN Caching Configuration
        proxy_cache s3_cdn_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 206 1h;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;

        # Add CDN cache status header to inspect HIT / MISS / EXPIRED / STALE
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # Bypass cache on client request if Cache-Control: no-cache header is provided
        proxy_cache_bypass $http_cache_control;
    }
}
