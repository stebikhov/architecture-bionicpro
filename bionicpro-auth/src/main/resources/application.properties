server.port=8081

# Keycloak / OAuth2 configuration
keycloak.auth-server-url=${KEYCLOAK_URL:http://localhost:8080}
keycloak.public-url=${KEYCLOAK_PUBLIC_URL:${keycloak.auth-server-url}}
keycloak.realm=${KEYCLOAK_REALM:reports-realm}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:bionicpro-auth}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:bionicpro-auth-secret}

# Reports API Target
reports.api.url=${REPORTS_API_URL:http://localhost:8000}

# Yandex OAuth configuration
yandex.client-id=${YANDEX_CLIENT_ID:yandex-client-id}
yandex.client-secret=${YANDEX_CLIENT_SECRET:yandex-client-secret}
yandex.userinfo.url=${YANDEX_USERINFO_URL:https://login.yandex.ru/info}

# Session settings (TTL in seconds, session lifetime > access_token lifespan 120s)
bionicpro.session.timeout-seconds=1800
bionicpro.session.cookie-secure=${COOKIE_SECURE:true}

# AES 256-bit secret key for in-memory token encryption (32 chars)
bionicpro.security.token-encryption-key=bionicpro-auth-secret-key-32ch!

# Database configuration (H2 embedded DB for user profile persistence)
spring.datasource.url=jdbc:h2:file:./data/userdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging
logging.level.com.bionicpro=DEBUG
