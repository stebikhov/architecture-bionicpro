server.port=8000

# Keycloak / OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/reports-realm}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://keycloak:8080/realms/reports-realm/protocol/openid-connect/certs}

# ClickHouse OLAP configuration
clickhouse.url=${CLICKHOUSE_URL:http://clickhouse:8123/bionicpro_analytics}
clickhouse.user=${CLICKHOUSE_USER:default}
clickhouse.password=${CLICKHOUSE_PASSWORD:}

# S3 / MinIO Configuration
s3.endpoint=${S3_ENDPOINT:http://minio:9000}
s3.access-key=${S3_ACCESS_KEY:minioadmin}
s3.secret-key=${S3_SECRET_KEY:minioadminpassword}
s3.bucket=${S3_BUCKET:bionicpro-reports}

# CDN Base URL
cdn.base-url=${CDN_BASE_URL:http://localhost:8082/bionicpro-reports}

logging.level.com.bionicpro.reports=DEBUG
